[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah-possession"
version = "0.1.0"
description = "Synthetic-first foundation for reproducible football possession inference"
requires-python = ">=3.11,<3.14"
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
evaluation = ["numpy==2.3.4", "pandas==2.3.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "uv==0.9.5"]

[project.scripts]
mtah-validate = "mtah.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --basetemp=.venv-foundation/pytest-tmp"
cache_dir = ".venv-foundation/.pytest_cache"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
cache-dir = ".venv-foundation/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = "==0.9.5"
